<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>레이저 메이즈 — 암호를 찾아라</title>
<style>
:root{--bg:#0d1626;--card:#16233a;--card2:#1d2e4a;--ink:#eaf1ff;--mut:#9fb2d0;--acc:#ff4a4a;--ok:#33d17a;--warn:#ffb300}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{max-width:1100px;margin:0 auto;padding:10px 14px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
h1 small{font-weight:500;color:var(--mut);font-size:13px;margin-left:6px}
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:auto;justify-content:flex-end}
.tabs .grp{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding-left:10px;margin-left:4px;border-left:2px solid var(--card2)}
.tabs .grp b{font-size:12px;color:var(--mut);margin-right:2px}
.tab.mini.lock{opacity:.4}
.tab.mini{padding:8px 0;width:34px;text-align:center;font-size:13px}
.tab.mini.done::after{content:"";}
.tab.mini.done{box-shadow:inset 0 -3px 0 #7dffb0}
@media (max-width:700px){.tabs{margin-left:0;justify-content:flex-start;width:100%}.tabs .grp{border-left:0;padding-left:0;margin-left:0}}
.tab{border:0;border-radius:999px;padding:8px 14px;background:var(--card2);color:var(--ink);font:700 14px/1 inherit;cursor:pointer}
.tab.on{background:var(--acc);color:#fff}
.tab.lock{opacity:.5}
.tab.done::after{content:" ✓";color:#7dffb0}
.tab.on.done::after{color:#fff}
.layout{max-width:1100px;margin:0 auto;padding:10px 14px 24px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.ctrl{grid-area:ctrl}.stage{grid-area:stage}.layout{grid-template-areas:"stage" "ctrl"}
@media (min-width:860px){
  .layout{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);grid-template-areas:"stage ctrl";align-items:start}
}
.card{background:var(--card);border-radius:16px;padding:12px 14px}
.goal{font-size:15px;font-weight:700;margin:0 0 8px}
.goal span{color:var(--acc)}
.btns{display:flex;gap:8px;margin-bottom:8px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 10px;font:800 16px/1 inherit;color:#fff;background:var(--acc);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.off{background:#3b4d6d}
.btn.sub{flex:0 0 auto;background:var(--card2);font-size:14px;font-weight:700;padding:13px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{background:var(--card2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--mut)}
.chip.ok{background:#16452f;color:#7dffb0}
.msg{font-size:14px;color:var(--mut);min-height:20px;margin:2px 0 8px}
.msg.bad{color:#ffd48a}
.stage{position:relative}
.tok.lit @keyframes pulse{from{r:14;opacity:.55}to{r:22;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.78);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.overlay.on{display:flex}
.win{background:var(--card);border-radius:22px;padding:22px 22px 18px;text-align:center;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.win h2{margin:0 0 6px;font-size:24px}
.win .big{font:800 56px/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px;color:#7dffb0;margin:8px 0 4px}
.win .sum{font-size:14px;color:var(--mut);margin-bottom:10px;word-break:keep-all}
.win .warn{font-size:14px;color:#ffb3b3;margin-bottom:12px}
.win .row{display:flex;gap:8px}
#wrap3d{position:relative;width:100%;height:calc(100dvh - 96px);min-height:420px;border-radius:18px;overflow:hidden;background:#0f1a2c}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ob .top,.ob .num{position:absolute;left:0;top:0;will-change:transform}
.ob .top{display:flex;gap:3px}
.ob i{font-style:normal;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;box-shadow:0 1px 4px #0008}
.ob i.r{background:#fff;color:#333}
.ob i.m{background:#e53935;color:#fff;border:2px solid #fff;font-size:11px}
.ob i.x{background:#ffb300;color:#000}
.ob .num{background:rgba(10,18,30,.8);color:#fff;font-weight:800;font-size:12px;min-width:20px;padding:1px 6px;border-radius:9px;text-align:center}
.vbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.vb{border:0;border-radius:10px;padding:9px 12px;background:var(--card2);color:var(--ink);font:700 13px/1 inherit;cursor:pointer}
.vb:active{transform:translateY(1px)}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#000c;color:#fff;border-radius:999px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}

.codebox{display:flex;align-items:center;gap:8px;background:#0a1220;border-radius:12px;padding:8px 10px}
.codebox label{font-weight:800;font-size:14px;white-space:nowrap}
#codeIn{flex:1;min-width:0;background:#16233a;border:2px solid #2d4266;border-radius:10px;color:#fff;text-align:center;font:800 28px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:8px;padding:6px 4px;outline:none}
#codeIn:focus{border-color:var(--acc)}
#codeIn.bad{border-color:#ff6b6b;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.codebox .btn{padding:12px 14px;font-size:15px}
.cmsg{word-break:keep-all;font-size:15px;color:var(--mut);min-height:18px;margin:6px 2px 0}
.cmsg.bad{color:#ffb3b3}
.secret{font-size:12px;color:#ffb3b3;margin:8px 0 0}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut);line-height:1.6}

/* ---- 모바일: 스크롤 없이 한 화면에 ---- */
@media (max-width:859px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{height:100dvh;min-height:0;display:flex;flex-direction:column}
  header{padding:6px 10px 0;gap:4px 8px;flex:0 0 auto}
  h1{font-size:16px}h1 small{display:none}
  .tab{padding:6px 10px;font-size:12px}
  .tab.mini{width:28px;padding:6px 0;font-size:12px}
  .tabs{gap:4px}.tabs .grp b{display:none}.tabs .grp{gap:4px}
  .layout{flex:1 1 auto;min-height:0;width:100%;padding:6px 10px calc(6px + env(safe-area-inset-bottom));gap:6px;
    grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage" "ctrl"}
  .stage{min-height:0;display:flex;flex-direction:column}
  .vb{padding:6px 9px;font-size:12px;background:#0f1a2ccc}
  #wrap3d{flex:1 1 auto;height:auto;min-height:0;border-radius:14px}
  .card{padding:8px 10px;border-radius:14px}
  .goal{font-size:13px;margin:0 0 5px}
  .btns{margin-bottom:5px;gap:6px}
  .btn{padding:10px 8px;font-size:15px}
  .btn.sub{padding:10px 12px;font-size:13px}
  .chips{margin-bottom:3px;gap:4px}.chip{padding:4px 8px;font-size:11px}
  .msg{font-size:12px;min-height:0;margin:0 0 5px;line-height:1.3}
  .codebox{padding:5px 8px;gap:6px}
  .codebox label{font-size:12px}
  #codeIn{font-size:22px;padding:3px 2px;letter-spacing:6px}
  .codebox .btn{padding:9px 12px;font-size:14px}
  .cmsg{font-size:12px;min-height:0;margin:4px 2px 0;line-height:1.3}
  .secret{font-size:11px;margin:4px 0 0}
  .key{font-size:20px;min-height:0}.key.go{font-size:15px}.key.cancel{font-size:14px}
  #upper{min-height:0}
  #toast{bottom:calc(120px + env(safe-area-inset-bottom))}
}
@media (max-width:400px){.tab.mini{width:25px}.tabs,.tabs .grp{gap:3px}}
@media (max-width:859px) and (max-height:620px){.msg{display:none}.cmsg:not(.bad){display:none}}

#upper{position:relative;min-height:104px}
.pad{position:absolute;inset:0;display:none;grid-template-columns:repeat(5,1fr) 1.35fr;grid-template-rows:1fr 1fr;gap:6px;background:var(--card);z-index:3}
.pad.on{display:grid}
.key{border:0;border-radius:10px;background:var(--card2);color:var(--ink);font:800 22px/1 ui-monospace,Menlo,Consolas,monospace;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.35);min-height:40px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.key:active{transform:translateY(2px);box-shadow:none;background:#2f4570}
.key.go{grid-column:6;grid-row:1;background:var(--acc);color:#fff;font:800 17px/1.1 inherit}
.key.cancel{grid-column:6;grid-row:2;background:#3b4d6d;color:#fff;font:800 15px/1.1 inherit}
#codeIn{cursor:pointer;caret-color:transparent}
#codeBox.open #codeIn{border-color:var(--acc)}
#codeLab{cursor:pointer}

[hidden]{display:none!important}
.home{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.hwrap{width:100%;max-width:640px;text-align:center}
.htitle{font-size:30px;margin:0 0 28px;letter-spacing:-.5px;line-height:1.3;word-break:keep-all}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hbtn{border:0;border-radius:20px;padding:48px 10px;color:#fff;font-family:inherit;font-weight:800;font-size:22px;line-height:1.2;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.hbtn .hic{font-size:48px;line-height:1}
.hbtn.laser{background:#15803d}.hbtn.sky{background:#7c5cff}
@media (max-width:520px){.htitle{font-size:24px}.hbtns{grid-template-columns:1fr}.hbtn{padding:40px 10px}}
.nav{display:flex;gap:6px;width:100%;box-sizing:border-box;max-width:1100px;margin:0 auto;padding:10px 14px 0}
.nav button{flex:1;white-space:nowrap;border:0;border-radius:999px;padding:10px 4px;background:var(--card2);color:var(--ink);font:700 14px/1 inherit;cursor:pointer}
.nav button.on[data-go=laser]{background:#15803d;color:#fff}
.nav button.on[data-go=tele]{background:#7c5cff;color:#fff}
.view{display:block}
header h1{display:none}
header{padding-top:8px}
.tabs{margin-left:0;justify-content:flex-start}
.tview{max-width:520px;margin:0 auto;padding:10px 14px 24px;display:flex;flex-direction:column;gap:10px}
.tstage{border-radius:16px;background:#0f1a2c;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.tstage .ttl{font-size:18px;font-weight:800}
.tstage .tsub{font-size:14px;color:var(--mut);line-height:1.5}
.tdg{display:flex;gap:10px}
.tdg b{width:54px;height:66px;border-radius:12px;background:#16233a;border:2px solid #2d4266;display:flex;align-items:center;justify-content:center;font:800 32px ui-monospace,Menlo,Consolas,monospace;color:#fff}
.tdg b.cur{border-color:#7c5cff}
.tdg.bad b{border-color:#ff6b6b}
.tdg.bad{animation:shake .35s}
.tbig{font:800 52px/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px;color:#7dffb0}
.tcard{background:var(--card);border-radius:16px;padding:10px}
.tpad{position:static;display:grid;height:116px}
.tpad .key.go{background:#7c5cff}
.tmsg{font-size:13px;color:#ffb3b3;min-height:18px;margin:6px 2px 0;text-align:center}
.tcard .btn.again{width:100%;background:#7c5cff}
@media (max-width:859px){
  .home{min-height:0;flex:1}
  .nav{padding:6px 10px 0;flex:0 0 auto}.nav button{padding:8px 2px;font-size:13px}
  #vLaser{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #vLaser[hidden]{display:none!important}
  header{padding:6px 10px 0}
  .tview{flex:1 1 auto;min-height:0;width:100%;padding:6px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
  .tstage{flex:1 1 auto;min-height:0;padding:8px;gap:8px}
  .tstage svg{max-height:26vh;width:auto}
  .tstage .ttl{font-size:16px}.tstage .tsub{font-size:12px}
  .tdg b{width:46px;height:56px;font-size:28px}
  .tbig{font-size:40px}
  .tcard{padding:8px;flex:0 0 auto}
  .tpad{height:100px}
}

.cbtn{position:absolute;top:8px;z-index:3;border:0;border-radius:10px;padding:8px 11px;background:#0f1a2ccc;color:var(--ink);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;touch-action:manipulation}
#vCam{left:8px}.fsb{right:8px}
.home{position:relative}.home .fsb{top:12px;right:12px}
.tview{position:relative}.tview .fsb{top:20px;right:22px}
.cbtn:active{transform:translateY(1px)}
.ptabs,.xtabs{display:flex;gap:6px;margin:0 0 8px}
.ptabs .tab{flex:1 1 0;min-width:0;white-space:nowrap;padding:10px 2px;font-size:13px}
.xtabs .tab.mini{flex:1 1 0;min-width:0;width:auto;padding:8px 0;font-size:13px}
.tdesc{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;font-size:14px;color:var(--mut);line-height:1.35}
.tdesc>div{display:flex;align-items:center;gap:8px}
.tdesc .ti{flex:0 0 auto;display:flex;align-items:center}
.tdesc img{width:48px;height:48px;object-fit:contain;display:block}
.tdesc .ti img:only-child{width:56px;height:56px}
.tdesc .ti img+img{margin-left:-14px}
.tdesc b{display:block;color:var(--ink);font-weight:700;font-size:15px;margin-bottom:1px}
@media (max-width:859px){
  .tdesc{display:none}
  .cbtn{top:6px;padding:7px 9px;font-size:12px}#vCam{left:6px}.fsb{right:6px}
  .tview .fsb{top:12px;right:16px}
  .ptabs,.xtabs{gap:4px;margin-bottom:5px}
  .ptabs .tab{padding:8px 1px;font-size:12px}
  .xtabs .tab.mini{padding:6px 0;font-size:12px}
}

/* ---- v2: 상단 버튼줄 / 높이 정렬 / 망원경 화면 ---- */
.tbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:8px;z-index:3;pointer-events:none}
.tbar .cbtn{position:static;pointer-events:auto;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 6px;font-size:14px;text-align:center}
.cbtn.fire{background:var(--acc);color:#fff;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.cbtn.fire.off{background:#3b4d6d}
.grow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.grow .goal{flex:1;margin:0}
.grow .btn.sub{flex:0 0 auto;padding:9px 12px;font-size:13px}
.tstage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 105%,#33256b 0%,#14193b 45%,#060a18 100%);padding:0}
.stars{position:absolute;inset:0}
.stars i{position:absolute;border-radius:50%;display:block}
@keyframes twk{0%,100%{opacity:.25}50%{opacity:1}}
.tsvg{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.tsvg svg{width:560px;max-width:92%;max-height:92%;height:auto}
.tview .fsb{top:8px;right:8px;z-index:3}
.tinfo{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tinfo .ttl{font-size:18px;font-weight:800}
.tinfo .tsub{font-size:14px;color:var(--mut)}
@media (min-width:860px){
  .layout{align-items:stretch;padding-bottom:12px}
  .stage{display:flex}
  #wrap3d{height:auto;min-height:max(560px,calc(100dvh - 72px))}
  .ctrl{display:flex;flex-direction:column}
  #upper{flex:0 0 auto}
  .tdesc{flex:1;margin-top:12px;grid-auto-rows:1fr;align-content:stretch;gap:8px 12px}
  .tview{max-width:1100px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:12px;padding:10px 14px 12px;align-items:stretch}
  .tstage{min-height:max(560px,calc(100dvh - 72px))}
  .tcard{display:flex;flex-direction:column;padding:16px;gap:10px}
  .tinfo{flex:1;justify-content:center;gap:16px}
  .tinfo .ttl{font-size:22px}.tinfo .tsub{font-size:16px}
  .tcard .tdg b{width:62px;height:76px;font-size:36px}
  .tpad{height:200px;flex:0 0 auto}
  .tmsg{min-height:20px;margin:0}
}
@media (max-width:859px){
  .tbar{top:6px;left:6px;right:6px;gap:6px}
  .tbar .cbtn{padding:8px 3px;font-size:12px}
  .tview .fsb{top:6px;right:6px}
  .tstage{flex:1 1 auto;min-height:0}
  .tinfo{gap:6px}.tinfo .ttl{font-size:15px}.tinfo .tsub{font-size:12px}
  .tcard .tdg b{width:44px;height:52px;font-size:26px}
  .tcard{padding:8px 10px}
  .tmsg{margin:2px 0 4px;min-height:16px}
  .grow .btn.sub{padding:7px 10px;font-size:12px}
}
</style>
</head>
<body>
<div id="home" class="home">
  <button class="cbtn fsb" hidden>⛶ 전체화면</button>
  <div class="hwrap">
    <h1 class="htitle">레이저와 천체 망원경 미션</h1>
    <div class="hbtns">
      <button class="hbtn laser" data-go="laser"><span>레이저 미션</span></button>
      <button class="hbtn sky" data-go="tele"><span>망원경 미션</span></button>
    </div>
  </div>
</div>
<nav class="nav" id="nav" hidden>
  <button data-go="laser">레이저 미션</button><button data-go="tele">망원경 미션</button><button data-go="home">메인 화면</button>
</nav>
<div id="vLaser" class="view" hidden>

<div class="layout">
  <section class="stage">
    <div id="wrap3d"><canvas id="gl"></canvas><div id="ov"></div>
      <div class="tbar"><button class="cbtn" id="vCam">🎥 시점 초기화</button><button class="cbtn fire" id="fire">🔦 레이저 발사</button><button class="cbtn fsb" hidden>⛶ 전체화면</button></div>
    </div>
  </section>

  <section class="ctrl card">
    <div id="upper">
    <div class="ptabs" id="ptabs"></div>
    <div class="xtabs" id="xtabs" hidden></div>
    <div class="grow"><p class="goal" id="goal"></p><button class="btn sub" id="reset">↺ 처음부터</button></div>
    <div class="chips" id="chips"></div>
    <div class="msg" id="msg"></div>
    <div class="pad" id="pad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button><button class="key" data-k="4">4</button><button class="key" data-k="5">5</button>
      <button class="key go" id="padGo">입력</button>
      <button class="key cancel" id="padCancel">취소</button>
      <button class="key" data-k="6">6</button><button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button><button class="key" data-k="0">0</button>
    </div>
    </div>
    <div class="codebox" id="codeBox"><label id="codeLab">🔐 암호</label><input id="codeIn" readonly inputmode="none" tabindex="-1" maxlength="4" autocomplete="off" placeholder="0000"><button class="btn sub" id="codeDel" aria-label="지우기">⌫</button></div>
    <div class="cmsg" id="cmsg">토큰이 놓인 칸 번호를 모두 더해 4자리로 입력해요 (예: 7 → 0007)</div>

/* 레이저 빔 시뮬레이션

  while (q.length) {
    const { r, c, d, dep } = q.shift();
    if (r < 0 || r > 4 || c < 0 || c > 4) continue;
    const key = (r * 5 + c) * 4 + d; if (seen.has(key)) continue; seen.add(key);
    const t = grid[r * 5 + c], e = (d + 2) % 4, cx = c + .5, cy = r + .5;

    const out = dd => { add(cx, cy, cx + DX[dd] * .5, cy + DY[dd] * .5, dep); q.push({ r: r + DY[dd], c: c + DX[dd], d: dd, dep: dep + 1 }); };

      case 'B': straight(); break;
      case 'L': touch(true); break;
      case 'K': {

      case 'S': touch(false); inSeg(); out(d); out(REF[t.o % 2][d]); break;
      case 'T': {
        const k = ((t.o % 4) + 4) % 4;

}

  opt = opt || {};
  const sim = simulate(toks, opt);
  const placed = toks.every(t => t.cell != null);
  const need = toks.filter(t => t.type !== 'B');
  const touchedN = need.filter(t => t.cell != null && sim.touched.has(t.cell)).length;
  const litN = sim.lit.size;
  const mustOk = toks.filter(t => t.must).every(t => t.cell != null && sim.lit.has(t.cell));
  const tgtOk = opt.geTargets ? litN >= p.targets : litN === p.targets;

  return { sim, placed, needN: need.length, touchedN, litN, mustOk, ok,

           cells: toks.filter(t => t.cell != null).map(t => t.cell).sort((a, b) => a - b) };
}

      gl.disable(gl.BLEND); gl.depthMask(true);
      const live = [];
      for (const s of segs) { const pr = d => prog(d), p = pr(s.d); if (p <= 0) continue; live.push({ x1: s.x1, z1: s.z1, x2: s.x1 + (s.x2 - s.x1) * p, z2: s.z1 + (s.z2 - s.z1) * p }); }
      setMat({ mode: 3, color: [1, .2, .2], alpha: 1, spec: 0, shin: 1, emis: [.1, 0, 0] });
      for (const s of live) { if (Math.hypot(s.x2 - s.x1, s.z2 - s.z1) < 1e-4) continue; gl.uniformMatrix4fv(P.u.uM, false, segMatrix(s.x1, s.z1, s.x2, s.z2, .028, BEAM_Y)); gl.bindVertexArray(cylMesh.vao); gl.drawElements(gl.TRIANGLES, cylMesh.n, gl.UNSIGNED_INT, 0); }
      setMat({ mode: 3, color: [1, 1, 1], alpha: 1, spec: 0, shin: 1, emis: ZERO });
      for (const s of live) { if (Math.hypot(s.x2 - s.x1, s.z2 - s.z1) < 1e-4) continue; gl.uniformMatrix4fv(P.u.uM, false, segMatrix(s.x1, s.z1, s.x2, s.z2, .011, BEAM_Y)); gl.bindVertexArray(cylMesh.vao); gl.drawElements(gl.TRIANGLES, cylMesh.n, gl.UNSIGNED_INT, 0); }
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      setMat({ mode: 3, color: [1, .12, .08], alpha: .3, spec: 0, shin: 1, emis: ZERO });
      for (const s of live) { if (Math.hypot(s.x2 - s.x1, s.z2 - s.z1) < 1e-4) continue; gl.uniformMatrix4fv(P.u.uM, false, segMatrix(s.x1, s.z1, s.x2, s.z2, .085, BEAM_Y)); gl.bindVertexArray(cylMesh.vao); gl.drawElements(gl.TRIANGLES, cylMesh.n, gl.UNSIGNED_INT, 0); }
      if (el > 1.0) for (const l of lits) { setMat({ mode: 3, color: [1, .35, .2], alpha: .35 * pulse, spec: 0, shin: 1, emis: ZERO }); const M = m4.trs(l[0], BEAM_Y, l[1], 0, .3); drawMesh(sphereMesh, M, P); }
    }
    gl.depthMask(true); gl.disable(gl.BLEND);
    updateOverlay(ev, fired);
  }
  /* 토큰 위 배지(HTML) */
  function updateOverlay(ev, fired) {
    const rect = canvas.getBoundingClientRect(), cw = canvas.clientWidth, ch = canvas.clientHeight;
    for (const t of S.toks) {
      const a = anims[t.id], e = badges[t.id]; if (!a || !e) continue;
      const top = xf(VP, [a.x, a.y + 1.12, a.z]), nm = xf(VP, [a.x, a.y + .05, a.z + .52]);
      const px = (top[0] * .5 + .5) * cw, py = (-top[1] * .5 + .5) * ch, nx = (nm[0] * .5 + .5) * cw, ny = (-nm[1] * .5 + .5) * ch;
      const tp = e.firstChild, nu = e.lastChild;
      tp.style.transform = `translate(${px}px,${py}px) translate(-50%,-100%)`; nu.style.transform = `translate(${nx}px,${ny}px) translate(-50%,-50%)`;
      tp.children[0].style.display = t.rot ? '' : 'none'; tp.children[1].style.display = t.must ? '' : 'none';
      const miss = fired && t.cell != null && t.type !== 'B' && !ev.sim.touched.has(t.cell);
      tp.children[2].style.display = miss ? '' : 'none';
      nu.textContent = t.cell != null ? t.cell : ''; nu.style.display = t.cell != null ? '' : 'none';
    }
  }
  if (!opts.icons) requestAnimationFrame(frame);

  /* 토큰 하나를 작은 그림(dataURL)으로 그리기 — 설명 패널용 */
  function icon(type, o, size, phi, theta) {
    canvas.width = canvas.height = size;
    const tg = [0, .42, 0], dist = 2.75, ph = (phi || 0) * D2R, th = (theta || 30) * D2R;
    const e = [tg[0] + dist * Math.sin(ph) * Math.cos(th), tg[1] + dist * Math.sin(th), tg[2] + dist * Math.cos(ph) * Math.cos(th)];
    const vp = m4.mul(m4.persp(34 * D2R, 1, .5, 50), m4.look(e, tg, [0, 1, 0])), M = m4.trs(0, 0, 0, -o * 90 * D2R, 1);
    gl.bindFramebuffer(gl.FRAMEBUFFER, shFB); gl.viewport(0, 0, SH, SH); gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.useProgram(PD.p); gl.uniformMatrix4fv(PD.u.uLVP, false, lightVP); gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
    for (const pt of models[type]) if (pt.mat.mode !== 2) drawMesh(pt.mesh, M, PD);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, size, size);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(P.p);
    gl.uniformMatrix4fv(P.u.uVP, false, vp); gl.uniformMatrix4fv(P.u.uLVP, false, lightVP); gl.uniform3fv(P.u.uCam, e); gl.uniform3fv(P.u.uLdir, LDIR);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, shTex); gl.uniform1i(P.u.uSh, 1);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, matTex); gl.uniform1i(P.u.uTex, 0); gl.uniform2f(P.u.uUVs, 1, 1);
    const glass = [];
    for (const pt of models[type]) { if (pt.mat.mode === 2) { glass.push(pt); continue; } setMat(pt.mat, null); drawMesh(pt.mesh, M, P); }
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    for (const pt of glass) { setMat(pt.mat, null); drawMesh(pt.mesh, M, P); }
    gl.depthMask(true); gl.disable(gl.BLEND);
    return canvas.toDataURL('image/png');
  }

  return {
    icon,
    sync,
    project(x, y, z) { const q = xf(VP, [x, y, z]), r = canvas.getBoundingClientRect(); return [r.left + (q[0] * .5 + .5) * r.width, r.top + (-q[1] * .5 + .5) * r.height]; },
    setView(name) {
      cam.tphi = Math.round(cam.tphi / (2 * Math.PI)) * 2 * Math.PI;   // 가장 가까운 정면으로
    }
  };
}
global.View3D = { create };
})(window);

</script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let curEv=null,V3=null,pIdx=0,toks=[],fired=false,selected=null;
let solved={};try{solved=JSON.parse(sessionStorage.getItem('laserMaze.solved')||'{}')}catch(e){}
const unlocked=i=>i===0||!!PUZZLES[i].extra||!!solved[PUZZLES[i-1].id];
const FIRSTX=PUZZLES.findIndex(q=>q.extra);let extraOpen=false;
const P=()=>PUZZLES[pIdx];
const byId=id=>toks.find(t=>t.id===id), tokAt=c=>toks.find(t=>t.cell===c);
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),1800)}
const CMSG0='토큰이 놓인 칸 번호를 모두 더해 4자리로 입력해요 (예: 7 → 0007)';
function cmsg(s,bad){const m=$('cmsg');m.textContent=s;m.className='cmsg'+(bad?' bad':'')}

function buildTabs(){
  const tab=(p,i,mini)=>`<button class="tab${mini?' mini':''}${solved[p.id]?' done':''}${i===pIdx?' on':''}${unlocked(i)?'':' lock'}" data-i="${i}" title="${p.name}">${unlocked(i)?'':'🔒 '}${mini?(i-FIRSTX+1):p.name}</button>`;
  const onEx=!!P().extra;
  $('ptabs').innerHTML=PUZZLES.map((p,i)=>p.extra?'':tab(p,i,false)).join('')+`<button class="tab${onEx?' on':''}" data-x="1">추가 미션 ${extraOpen?'▴':'▾'}</button>`;
  $('xtabs').innerHTML=PUZZLES.map((p,i)=>p.extra?tab(p,i,true):'').join('');
  $('xtabs').hidden=!extraOpen;
}
function onTabClick(e){
  const b=e.target.closest('.tab');if(!b)return;
  if(b.dataset.x){if(!P().extra){loadPuzzle(FIRSTX)}else{extraOpen=!extraOpen;buildTabs()}return}
  const i=+b.dataset.i;
  if(!unlocked(i)){toast(PUZZLES[i-1].name+' 성공 후에 열려요 🔒');return}
  loadPuzzle(i);
}
$('ptabs').addEventListener('click',onTabClick);$('xtabs').addEventListener('click',onTabClick);

function loadPuzzle(i){
  pIdx=i;extraOpen=!!PUZZLES[i].extra;toks=makeTokens(P());fired=false;selected=null;
  $('winOv').classList.remove('on');$('codeIn').value='';padOpen(false);cmsg(CMSG0);
  buildTabs();
  const p=P();
  $('goal').innerHTML=`🎯 레이저가 <span>타겟 ${p.targets}개</span>에 닿게 만드세요`;
  $('secret').hidden=!p.secret;
  update(false,true);
}

/* ---------- 갱신 ---------- */
function update(anim,keepMsg){
  const p=P(),ev=evaluate(p,toks);curEv=ev;
  const showBeam=fired&&ev.sim.hasLaser;
  const addTot=toks.filter(t=>!t.fixedPos).length,addPl=toks.filter(t=>!t.fixedPos&&t.cell!=null).length;
  let chips=`<span class="chip${addPl===addTot?' ok':''}">🧩 추가 토큰 ${addPl}/${addTot}</span>`;
  if(showBeam){
    chips+=`<span class="chip${ev.litN===p.targets?' ok':''}">🎯 타겟 ${ev.litN}/${p.targets}</span>`;
    chips+=`<span class="chip${ev.touchedN===ev.needN?' ok':''}">✅ 지나간 토큰 ${ev.touchedN}/${ev.needN}</span>`;
  }
  $('chips').innerHTML=chips;
  let msg='',bad=false;
  if(!ev.placed) msg='추가 토큰을 모두 격자에 놓아 보세요.';
  else if(!fired) msg='준비가 되면 🔦 레이저를 발사해 보세요!';
  else if(!ev.sim.hasLaser) msg='레이저 토큰이 격자에 없어요.';
  else if(ev.ok) msg='레이저 성공! 이제 토큰이 놓인 칸 번호를 더해 암호를 입력하세요.';
  else{
    bad=true;
    if(ev.touchedN<ev.needN) msg='경고 표시(!)가 있는 토큰에는 아직 빔이 닿지 않았어요.';
    else if(!ev.mustOk) msg='빨간 ◎ 표시 토큰의 타겟(빨간 점)에 빔이 닿아야 해요.';
    else if(ev.litN<p.targets) msg='타겟에 닿은 빔이 더 필요해요.';
    else msg='닿은 타겟이 정해진 수보다 많아요.';
  }
  $('msg').textContent=msg;$('msg').className='msg'+(bad?' bad':'');
  $('fire').textContent=fired?'⏹ 레이저 끄기':'🔦 레이저 발사';
  $('fire').classList.toggle('off',fired);
  if(!keepMsg)cmsg(CMSG0);
  if(V3)V3.sync(anim);
}

/* ---------- 암호 입력 ---------- */
function submitCode(){
  const v=$('codeIn').value,ev=curEv,p=P();
  const bad=m=>{cmsg(m,true);const i=$('codeIn');i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad')};
  if(v.length<4){bad('4자리를 모두 입력해 주세요.');return}
  if(!fired||!ev||!ev.ok){bad(!fired?'먼저 🔦 레이저를 발사해서 미션을 완성해 보세요.':'아직 미션이 완성되지 않았어요. 레이저가 모든 토큰을 지나 타겟에 닿아야 해요.');return}
  if(v!==ev.code){bad('암호가 맞지 않아요. 토큰이 놓인 칸 번호를 모두 더해 보세요.');return}
  cmsg('');padOpen(false);
  $('winCode').textContent=ev.code;
  $('winSum').textContent=toks.map(t=>t.cell).sort((a,b)=>a-b).join(' + ')+' = '+(+ev.code);
  $('winWarn').hidden=!p.secret;
  $('winNext').style.display=pIdx<PUZZLES.length-1?'':'none';
  $('winOv').classList.add('on');
  solved[p.id]=1;try{sessionStorage.setItem('laserMaze.solved',JSON.stringify(solved))}catch(e){}
  buildTabs();
}
/* 화면 숫자 패드 (기기 키보드는 쓰지 않음) */
function padOpen(on){$('pad').classList.toggle('on',on);$('codeBox').classList.toggle('open',on)}
const togglePad=()=>padOpen(!$('pad').classList.contains('on'));
$('codeIn').addEventListener('click',togglePad);
$('codeLab').addEventListener('click',togglePad);
$('pad').addEventListener('click',e=>{
  const b=e.target.closest('.key');if(!b||b.id==='padGo'||b.id==='padCancel')return;
  const i=$('codeIn');if(i.value.length<4)i.value+=b.dataset.k;i.classList.remove('bad');
});
$('codeDel').addEventListener('click',()=>{const i=$('codeIn');i.value=i.value.slice(0,-1);i.classList.remove('bad')});
$('padGo').addEventListener('click',submitCode);
$('padCancel').addEventListener('click',()=>{const i=$('codeIn');i.value='';i.classList.remove('bad');cmsg(CMSG0);padOpen(false)});
$('wrap3d').addEventListener('pointerdown',()=>padOpen(false));

/* ---------- 버튼 ---------- */
$('fire').addEventListener('click',()=>{
  if(!fired){
    if(!toks.some(t=>t.type==='L'&&t.cell!=null)){toast('먼저 레이저 토큰을 격자에 놓아 주세요');return}
    fired=true;update(true);
  }else{fired=false;update()}
});
$('reset').addEventListener('click',()=>loadPuzzle(pIdx));
$('winClose').addEventListener('click',()=>$('winOv').classList.remove('on'));
$('winNext').addEventListener('click',()=>{const n=pIdx+1;if(n<PUZZLES.length&&unlocked(n))loadPuzzle(n)});

/* ---------- 3D 연결 ---------- */
const api3={
  state:()=>({toks,fired,selected,ev:curEv}),
  tapToken(id){const t=byId(id);if(t.cell==null)selected=(selected===t.id?null:t.id);else if(t.rot){t.o++;selected=null}else toast('이 토큰은 돌릴 수 없어요 🔒');update()},
  place(id,c){const t=byId(id);t.cell=c;selected=null;update()},
  toTray(id){const t=byId(id);t.cell=null;selected=null;update()},
  tapCell(c){if(c&&selected&&!tokAt(c)){byId(selected).cell=c;selected=null}else selected=null;update()},
  refresh(){update()}
};

try{V3=View3D.create($('gl'),$('ov'),api3)}catch(err){console.error(err);V3=null}
if(!V3){$('wrap3d').insertAdjacentHTML('beforeend','<div class="nogl">이 기기·브라우저는 3D(WebGL2)를 지원하지 않아요.<br>최신 Chrome, Safari, Edge로 열어 주세요.</div>');$('vCam').classList.add('hide')}
$('vCam').addEventListener('click',()=>V3.setView('front'));
/* 전체화면 (아이폰 Safari는 지원하지 않아 버튼을 숨김) */
(()=>{
  const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen,btns=[...document.querySelectorAll('.fsb')];
  const cur=()=>document.fullscreenElement||document.webkitFullscreenElement;
  if(!req||/iPhone|iPod/.test(navigator.userAgent))return;
  btns.forEach(btn=>{btn.hidden=false;btn.addEventListener('click',()=>{
    if(cur()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{try{const r=req.call(el);if(r&&r.catch)r.catch(()=>toast('전체화면으로 바꿀 수 없어요'))}catch(e){toast('전체화면으로 바꿀 수 없어요')}}
  })});
  const upd=()=>btns.forEach(b=>{b.textContent=cur()?'✕ 전체화면 해제':'⛶ 전체화면'});
  document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd);
})();
/* 토큰 설명용 3D 그림 (PC 화면에서만 만들어 둠) */
(()=>{
  let done=false;
  function make(){
    if(done||!window.matchMedia('(min-width:860px)').matches)return;done=true;
    try{
      const c=document.createElement('canvas'),v=View3D.create(c,document.createElement('div'),{state:()=>({toks:null})},{icons:true});
      if(!v)return;
      document.querySelectorAll('#tdesc img[data-ic]').forEach(im=>{const [t,o]=im.dataset.ic.split(',');im.src=v.icon(t,+o,192,-20,32)});
      const gl=c.getContext('webgl2');if(gl){const x=gl.getExtension('WEBGL_lose_context');if(x)x.loseContext()}
    }catch(e){console.error(e)}
  }
  window.addEventListener('resize',make);setTimeout(make,0);
})();

/* ---------- 화면 전환 (메인 / 레이저 미션 / 망원경 미션) ---------- */
let view='home';
function show(v){
  view=v;
  $('home').hidden=v!=='home';$('vLaser').hidden=v!=='laser';$('vTele').hidden=v!=='tele';$('nav').hidden=v==='home';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
  if(v==='laser'){padOpen(false);if(V3){V3.sync(false)}}
  if(v==='tele')teleDraw();
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)show(b.dataset.go)});

/* ---------- 망원경 미션 ---------- */
const TCODE='8127';let tv='',tbad=false,tdone=false;
try{tdone=sessionStorage.getItem('laserMaze.tele')==='1'}catch(e){}
const TSVG='<svg viewBox="0 0 170 110" role="img" aria-label="천체망원경 그림"><line x1="85" y1="62" x2="52" y2="104" stroke="#3b4d6d" stroke-width="5"/><line x1="85" y1="62" x2="118" y2="104" stroke="#3b4d6d" stroke-width="5"/><line x1="85" y1="62" x2="85" y2="104" stroke="#3b4d6d" stroke-width="5"/><g transform="rotate(-28 85 56)"><rect x="40" y="44" width="92" height="22" rx="4" fill="#7c5cff"/><rect x="124" y="40" width="14" height="30" rx="3" fill="#a897ff"/><rect x="26" y="50" width="16" height="10" rx="2" fill="#9db0d3"/><rect x="62" y="34" width="22" height="8" rx="2" fill="#3b4d6d"/></g><circle cx="146" cy="16" r="2" fill="#fff"/><circle cx="20" cy="22" r="1.5" fill="#fff"/><circle cx="120" cy="8" r="1.5" fill="#9db0d3"/></svg>';
function teleDigits(){let h='<div class="tdg'+(tbad?' bad':'')+'" id="tDg">';for(let i=0;i<4;i++)h+='<b'+(i===tv.length&&!tbad?' class="cur"':'')+'>'+(tv[i]||'')+'</b>';return h+'</div>'}
function mkStars(){
  const el=$('stars');if(el.childElementCount)return;
  let h='';const cols=['#fff','#fff','#fff','#cfe0ff','#ffe9b8','#ffd0d0'];
  for(let i=0;i<300;i++){
    const sz=Math.random()<.65?1.3+Math.random()*.9:2.4+Math.random()*1.8,c=cols[(Math.random()*cols.length)|0];
    const tw=Math.random()<.45?';animation:twk '+(2+Math.random()*4).toFixed(1)+'s ease-in-out '+(Math.random()*4).toFixed(1)+'s infinite':'';
    const gl=sz>2.4?';box-shadow:0 0 '+(sz*2).toFixed(1)+'px '+c:'';
    h+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*100).toFixed(1)+'%;width:'+sz.toFixed(1)+'px;height:'+sz.toFixed(1)+'px;background:'+c+';opacity:'+(.45+Math.random()*.55).toFixed(2)+gl+tw+'"></i>';
  }
  el.innerHTML=h;
}
function teleDraw(){
  mkStars();$('tSvg').innerHTML=TSVG;
  if(tdone){
    $('tInfo').innerHTML='<div style="font-size:44px;line-height:1">🎉</div><div class="ttl">미션 성공!</div><div class="tbig">'+TCODE+'</div><div class="tsub">다른 모둠에게는 비밀이에요</div>';
    $('tPad').hidden=true;$('tMsg').hidden=true;
    if(!$('tAgain')){const b=document.createElement('button');b.id='tAgain';b.className='btn again';b.textContent='다시 해 보기';b.onclick=()=>{tdone=false;tv='';tbad=false;try{sessionStorage.removeItem('laserMaze.tele')}catch(e){}teleDraw()};$('tCard').appendChild(b)}
    $('tAgain').hidden=false;return;
  }
  $('tPad').hidden=false;$('tMsg').hidden=false;if($('tAgain'))$('tAgain').hidden=true;
  $('tInfo').innerHTML='<div class="ttl">망원경으로 숫자를 관측하세요</div><div class="tsub">4자리 암호를 입력하세요</div>'+teleDigits();
  $('tMsg').textContent='';
}
function teleUpd(){const o=$('tDg');if(o)o.outerHTML=teleDigits();$('tMsg').textContent=''}
$('tPad').addEventListener('click',e=>{
  const b=e.target.closest('.key');if(!b)return;
  if(b.id==='tCx'){tv='';tbad=false;teleUpd();return}
  if(b.id==='tGo'){
    if(tv.length<4){tbad=true;teleUpd();$('tMsg').textContent='4자리를 모두 입력해 주세요.';return}
    if(tv===TCODE){tdone=true;try{sessionStorage.setItem('laserMaze.tele','1')}catch(e){}teleDraw();return}
    tbad=true;teleUpd();$('tMsg').textContent='암호가 달라요. 망원경으로 다시 살펴보세요.';return;
  }
  if(tv.length<4){tv+=b.dataset.k;tbad=false;teleUpd()}
});


buildTabs();loadPuzzle(0);show('home');
})();
</script>
